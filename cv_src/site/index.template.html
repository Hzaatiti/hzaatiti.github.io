<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV, {{NAME}}</title>
<meta name="description" content="Curriculum vitae of {{NAME}}. {{ROLE_PLAIN}}.">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="../assets/fonts/libertinus-serif-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/libertinus-serif-display-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<header class="wrap top">
  <a class="me" href="../index.html">{{NAME}}</a>
  <nav aria-label="Main">
    <a href="../index.html">Home</a>
    <a href="../projects.html">Projects</a>
    <a href="index.html" aria-current="page">CV</a>
    <a href="../index.html#contact">Contact</a>
  </nav>
</header>

<main class="cv">
  <section class="wrap title cv-head">
    <div class="row">
      <div class="note">{{PHOTO}}</div>
      <div class="text">
        <h1>{{NAME}}</h1>
        <p class="field">{{ROLE}}</p>
        <ul class="reach">{{CONTACT}}</ul>
        <p class="summary">{{SUMMARY}}</p>
        <ul class="links"><li><a class="button" href="./{{PDF_NAME}}" download="{{PDF_NAME}}">Download as PDF</a></li></ul>
      </div>
    </div>
  </section>

  <section class="wrap part" aria-labelledby="cv-exp">
    <div class="row head"><div class="note"></div><div class="text"><h2 id="cv-exp">Experience</h2></div></div>
      {{EXPERIENCE}}
  </section>

  <section class="wrap part" aria-labelledby="cv-proj">
    <div class="row head"><div class="note"></div><div class="text"><h2 id="cv-proj">Projects</h2></div></div>
      {{PROJECTS}}
  </section>

  <section class="wrap part" aria-labelledby="cv-edu">
    <div class="row head"><div class="note"></div><div class="text"><h2 id="cv-edu">Education</h2></div></div>
      {{EDUCATION}}
  </section>

  <section class="wrap part skills" aria-labelledby="cv-skills">
    <div class="row head"><div class="note"></div><div class="text"><h2 id="cv-skills">Skills</h2></div></div>
      {{SKILLS}}
  </section>

  <section class="wrap part" aria-labelledby="cv-lang">
    <div class="row head"><div class="note"></div><div class="text"><h2 id="cv-lang">Languages</h2></div></div>
    <div class="row"><div class="note"></div><div class="text"><p>{{LANGUAGES}}</p></div></div>
  </section>

  <section class="wrap part" aria-labelledby="cv-pubs">
    <div class="row head"><div class="note"></div><div class="text"><h2 id="cv-pubs">Publications</h2></div></div>
    <div class="row"><div class="note"></div><div class="text"><p>{{PUBLICATIONS}}</p></div></div>
  </section>
</main>

<footer class="wrap foot">
  <span>© <span id="yr">2026</span> {{NAME}}</span>
  <span>Abu Dhabi</span>
</footer>

<script src="../assets/js/main.js"></script>
</body>
</html>
